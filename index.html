<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BlizTik API — Test</title>
  <meta name="description" content="BlizTik API test page for checking the live TikTok downloader API.">
  <style>
    :root{
      --bg:#0b1020;
      --panel:#111a2e;
      --panel2:#0f1728;
      --text:#f7f9ff;
      --muted:#9aa8c2;
      --line:#263553;
      --blue:#3d8cff;
      --blue2:#2468d8;
      --green:#36d399;
      --red:#ff6b7a;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 90% 5%, rgba(48,117,230,.28), transparent 28%),
        radial-gradient(circle at 8% 90%, rgba(45,91,180,.22), transparent 25%),
        var(--bg);
    }
    .wrap{width:min(100% - 28px,980px);margin:auto}
    header{padding:48px 0 24px}
    .brand{
      display:inline-flex;align-items:center;gap:10px;
      font-weight:800;font-size:22px;letter-spacing:-.4px
    }
    .brand-mark{width:30px;height:30px;flex:none}
    .hero{
      position:relative;overflow:hidden;
      padding:42px 28px 34px;border:1px solid #35517f;
      border-radius:26px;background:linear-gradient(135deg,#172b55,#1d4e98);
      box-shadow:0 20px 60px rgba(0,0,0,.28);
    }
    .hero:before,.hero:after{
      content:"";position:absolute;border-radius:50%;pointer-events:none
    }
    .hero:before{width:280px;height:280px;right:-95px;top:-125px;background:rgba(63,139,255,.35)}
    .hero:after{width:210px;height:210px;left:-125px;bottom:-125px;background:rgba(35,91,190,.35)}
    .hero>*{position:relative;z-index:1}
    h1{margin:0 0 8px;font-size:clamp(34px,7vw,56px);letter-spacing:-2px}
    .tagline{margin:0;color:#cfe0ff;font-size:18px;font-weight:650}
    .badge{
      display:inline-block;margin-top:22px;padding:10px 16px;border-radius:10px;
      background:#2d80e9;font-weight:800;font-size:14px
    }
    .card{
      margin-top:20px;padding:24px;border:1px solid var(--line);
      border-radius:22px;background:rgba(17,26,46,.92)
    }
    .card h2{margin:0 0 7px;font-size:21px}
    .sub{margin:0 0 18px;color:var(--muted);font-size:14px}
    .row{display:flex;gap:10px}
    input{
      flex:1;min-width:0;padding:15px 16px;border-radius:12px;
      border:1px solid #344664;background:#0a1221;color:var(--text);
      outline:none;font-size:15px
    }
    input:focus{border-color:#4a95ff;box-shadow:0 0 0 3px rgba(74,149,255,.14)}
    button{
      border:0;border-radius:12px;padding:0 22px;background:var(--blue);
      color:white;font-weight:800;font-size:15px;cursor:pointer
    }
    button:disabled{opacity:.6;cursor:wait}
    .status{
      display:none;margin-top:15px;padding:12px 14px;border-radius:12px;
      background:#0a1221;border:1px solid var(--line);font-size:14px
    }
    .status.ok{display:block;border-color:rgba(54,211,153,.4);color:#9ff0ce}
    .status.err{display:block;border-color:rgba(255,107,122,.4);color:#ffb5be}
    .result{display:none;margin-top:18px}
    .result-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 10px}
    .result h3{font-size:16px;margin:0}
    .icon-btn{width:40px;height:40px;padding:0;display:inline-flex;align-items:center;justify-content:center;background:#111b30;border:1px solid var(--line);border-radius:11px;color:#dce7fb;transition:.18s ease}
    .icon-btn:hover:not(:disabled){border-color:#4a95ff;background:#16233c;transform:translateY(-1px)}
    .icon-btn:disabled{opacity:.45;cursor:not-allowed}
    .icon-btn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .check-icon{display:none}
    .icon-btn.copied .copy-icon{display:none}
    .icon-btn.copied .check-icon{display:block;color:var(--green)}
    pre{
      margin:0;max-height:520px;overflow:auto;padding:16px;border-radius:14px;
      background:#070d18;border:1px solid var(--line);color:#dce7fb;
      font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace
    }
    .flow{margin-top:20px;padding:18px;border:1px solid var(--line);border-radius:20px;background:#0e1728}
    .flow img{display:block;width:100%;height:auto;border-radius:14px}
    footer{padding:30px 0 50px;display:flex;justify-content:center}
    .github-link{
      width:46px;height:46px;display:inline-flex;align-items:center;justify-content:center;
      border:1px solid var(--line);border-radius:14px;background:#111a2e;color:#fff;
      transition:.18s ease;box-shadow:0 8px 24px rgba(0,0,0,.18)
    }
    .github-link:hover{transform:translateY(-2px);border-color:#4a95ff;background:#16233c}
    .github-link svg{width:25px;height:25px;fill:currentColor}
    .timing-note{margin-top:9px;color:var(--muted);font-size:12px}
    @media(max-width:620px){
      header{padding-top:28px}
      .hero{padding:32px 20px}
      .row{flex-direction:column}
      button{height:50px}
      input{width:100%}
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div class="brand" aria-label="BlizTik API">
        <svg class="brand-mark" viewBox="0 0 48 48" aria-hidden="true">
          <defs><linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5aa2ff"/><stop offset="1" stop-color="#2866d7"/></linearGradient></defs>
          <rect x="3" y="3" width="42" height="42" rx="13" fill="url(#brandGrad)"/>
          <path d="M15 14h18v5h-6.3v15h-5.4V19H15z" fill="white"/>
          <path d="M30.5 27.2l3.7 3.7-3.7 3.7-3.7-3.7z" fill="#dcecff"/>
        </svg>
        <span>BlizTik API</span>
      </div>
    </header>

    <section class="hero">
      <h1>BlizTik API</h1>
      <p class="tagline">TikTok media downloader API</p>
      <span class="badge">Simple REST API</span>
    </section>

    <section class="card">
      <h2>API Test</h2>
      <p class="sub">Paste a public TikTok URL to check whether the API responds correctly.</p>

      <div class="row">
        <input id="url" type="url" placeholder="https://www.tiktok.com/@user/video/..." autocomplete="off">
        <button id="testBtn" type="button">GET</button>
      </div>

      <div id="status" class="status"></div>

      <div id="result" class="result">
        <div class="result-head">
          <h3>JSON Response</h3>
          <button id="copyBtn" class="icon-btn" type="button" aria-label="Copy JSON" title="Copy JSON" disabled>
            <svg class="copy-icon" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="8" y="8" width="11" height="12" rx="2"></rect>
              <path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h2"></path>
            </svg>
            <svg class="check-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="m5 12 4 4L19 6"></path>
            </svg>
          </button>
        </div>
        <pre id="json"></pre>
      </div>
    </section>

    <section class="flow">
      <img src="architecture.svg" alt="BlizTik API flow">
    </section>

    <footer>
      <a class="github-link" href="https://github.com/BlizPS/bliztik-api" target="_blank" rel="noopener" aria-label="Open BlizTik API on GitHub" title="BlizTik API on GitHub">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .5a12 12 0 0 0-3.79 23.39c.6.11.82-.26.82-.58v-2.04c-3.34.73-4.04-1.42-4.04-1.42-.55-1.4-1.34-1.77-1.34-1.77-1.09-.75.08-.74.08-.74 1.2.08 1.84 1.23 1.84 1.23 1.07 1.84 2.8 1.31 3.49 1 .11-.78.42-1.31.76-1.61-2.67-.3-5.47-1.34-5.47-5.95 0-1.31.47-2.38 1.23-3.22-.12-.3-.53-1.52.12-3.17 0 0 1-.32 3.3 1.23a11.45 11.45 0 0 1 6 0c2.29-1.55 3.29-1.23 3.29-1.23.65 1.65.24 2.87.12 3.17.77.84 1.23 1.91 1.23 3.22 0 4.62-2.8 5.65-5.48 5.95.43.37.81 1.1.81 2.22v3.29c0 .32.22.69.83.57A12 12 0 0 0 12 .5Z"/></svg>
      </a>
    </footer>
  </main>

  <script>
    const API_BASE = "https://api.bliztik.web.id/apitiktok?url=";
    const input = document.getElementById("url");
    const button = document.getElementById("testBtn");
    const status = document.getElementById("status");
    const result = document.getElementById("result");
    const json = document.getElementById("json");
    const copyBtn = document.getElementById("copyBtn");

    function setStatus(message, type) {
      status.textContent = message;
      status.className = "status " + type;
    }

    async function testApi() {
      const tiktokUrl = input.value.trim();

      if (!tiktokUrl) {
        setStatus("Masukkan URL TikTok terlebih dahulu.", "err");
        result.style.display = "none";
        return;
      }

      button.disabled = true;
      button.textContent = "GET...";
      result.style.display = "none";
      json.textContent = "";
      copyBtn.disabled = true;
      copyBtn.classList.remove("copied");
      setStatus("Checking API...", "ok");

      // Exact client-side request time: from immediately before fetch()
      // until the complete response body has been received. No simulated ms.
      const started = performance.now();
      const requestUrl = API_BASE + encodeURIComponent(tiktokUrl);

      try {
        const response = await fetch(requestUrl, {
          method: "GET",
          headers: { "Accept": "application/json" },
          cache: "no-store",
          credentials: "omit"
        });

        const text = await response.text();
        const elapsed = Math.max(0, Math.round(performance.now() - started));

        let data;
        try {
          data = JSON.parse(text);
        } catch {
          throw new Error("API returned a non-JSON response.");
        }

        // HTTP status and measured elapsed time come directly from this request.
        // The JSON is shown exactly as returned by the API.
        json.textContent = JSON.stringify(data, null, 2);
        result.style.display = "block";
        copyBtn.disabled = false;

        if (response.ok) {
          setStatus(`API ACTIVE • HTTP ${response.status} • ${elapsed} ms`, "ok");
        } else {
          setStatus(`API REACHABLE • HTTP ${response.status} • ${elapsed} ms`, "err");
        }
      } catch (error) {
        const elapsed = Math.round(performance.now() - started);
        setStatus(`API CHECK FAILED • ${elapsed} ms • ${error.message}`, "err");
        result.style.display = "none";
      } finally {
        button.disabled = false;
        button.textContent = "GET";
      }
    }

    copyBtn.addEventListener("click", async () => {
      if (!json.textContent) return;
      try {
        await navigator.clipboard.writeText(json.textContent);
      } catch (_) {
        const area = document.createElement("textarea");
        area.value = json.textContent;
        area.style.position = "fixed";
        area.style.opacity = "0";
        document.body.appendChild(area);
        area.select();
        document.execCommand("copy");
        area.remove();
      }
      copyBtn.classList.add("copied");
      setTimeout(() => copyBtn.classList.remove("copied"), 1200);
    });

    button.addEventListener("click", testApi);
    input.addEventListener("keydown", e => {
      if (e.key === "Enter") testApi();
    });
  </script>
</body>
</html>
