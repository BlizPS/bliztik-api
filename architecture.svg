<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">BlizTik API flow</title>
<desc id="desc">A TikTok URL is sent to BlizTik API, which returns JSON to the application.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#111b33"/>
    <stop offset="1" stop-color="#080e1d"/>
  </linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#4b98ff"/>
    <stop offset="1" stop-color="#2867d8"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity=".28"/>
  </filter>
</defs>

<rect width="1200" height="430" rx="28" fill="url(#bg)"/>
<text x="60" y="62" fill="#f5f8ff" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="800">BlizTik API Flow</text>
<text x="60" y="94" fill="#91a0bc" font-family="Inter,Arial,sans-serif" font-size="16">Simple request → extraction → JSON response</text>

<g filter="url(#shadow)">
  <rect x="60" y="145" width="285" height="190" rx="24" fill="#111a2e" stroke="#2a3b5d"/>
  <rect x="457" y="125" width="285" height="230" rx="26" fill="url(#blue)"/>
  <rect x="855" y="145" width="285" height="190" rx="24" fill="#111a2e" stroke="#2a3b5d"/>
</g>

<text x="202" y="195" text-anchor="middle" fill="#dfe8fb" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700">1</text>
<text x="202" y="232" text-anchor="middle" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="800">TikTok URL</text>
<text x="202" y="264" text-anchor="middle" fill="#8fa0bf" font-family="Inter,Arial,sans-serif" font-size="15">Public post URL</text>
<text x="202" y="291" text-anchor="middle" fill="#8fa0bf" font-family="Inter,Arial,sans-serif" font-size="15">sent as a request</text>

<text x="599" y="174" text-anchor="middle" fill="#dceaff" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700">2</text>
<text x="599" y="218" text-anchor="middle" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="800">BlizTik API</text>
<text x="599" y="251" text-anchor="middle" fill="#e2edff" font-family="Inter,Arial,sans-serif" font-size="15">Extracts available</text>
<text x="599" y="278" text-anchor="middle" fill="#e2edff" font-family="Inter,Arial,sans-serif" font-size="15">media + metadata</text>
<text x="599" y="319" text-anchor="middle" fill="#ffffff" font-family="ui-monospace,monospace" font-size="14">HTTP → JSON</text>

<text x="997" y="195" text-anchor="middle" fill="#dfe8fb" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700">3</text>
<text x="997" y="232" text-anchor="middle" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="800">Your App</text>
<text x="997" y="264" text-anchor="middle" fill="#8fa0bf" font-family="Inter,Arial,sans-serif" font-size="15">Read the JSON</text>
<text x="997" y="291" text-anchor="middle" fill="#8fa0bf" font-family="Inter,Arial,sans-serif" font-size="15">and use the fields</text>

<path d="M350 240 H442" stroke="#4b98ff" stroke-width="4" stroke-linecap="round"/>
<path d="M429 226 L444 240 L429 254" fill="none" stroke="#4b98ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M748 240 H840" stroke="#4b98ff" stroke-width="4" stroke-linecap="round"/>
<path d="M827 226 L842 240 L827 254" fill="none" stroke="#4b98ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
